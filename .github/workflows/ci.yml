name: CI

# 触发：推送到 main，以及所有 PR。没有 secrets、只读权限——本仓库是公开的，
# 别人可以随便开 PR 触发它，所以这里刻意不碰任何密钥（签名私钥按设计离线保管）。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 语法 / 一致性 / 签名
    runs-on: ubuntu-24.04
    steps:
      # 供应链卫生：按 commit SHA 钉住 action（本仓库教别人别盲目信任下载内容，
      # 自己也不该 `@v4` 这种可漂移的引用）；并关掉凭据持久化
      - name: 检出
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          persist-credentials: false

      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck minisign

      - name: bash 语法检查
        run: |
          bash -n skills/vps-security/scripts/vps-secure.sh
          bash -n scripts/sign-release.sh
          echo "✅ 语法通过"

      - name: ShellCheck（错误级必须为 0）
        run: |
          shellcheck -S error -f gcc \
            skills/vps-security/scripts/vps-secure.sh \
            scripts/sign-release.sh
          echo "✅ 无错误级问题"

      - name: ShellCheck 警告级（只提示，不阻塞）
        continue-on-error: true
        run: |
          echo "::notice::以下为警告级提示（已知项记录在 CHANGELOG 的待办里）"
          shellcheck -S warning -f gcc \
            skills/vps-security/scripts/vps-secure.sh \
            scripts/sign-release.sh || true

      - name: 仓库一致性（中英同步 / 无管道执行 / 版本号 / 校验值与签名）
        run: python3 scripts/check-repo-consistency.py

      - name: 危险模式扫描
        run: |
          S=skills/vps-security/scripts/vps-secure.sh
          ! grep -nE '(^|[^[:alnum:]_])eval[[:space:]]' "$S" \
            || { echo "::error::脚本里出现 eval"; exit 1; }
          ! grep -nE 'base64[[:space:]]+(-d|--decode)' "$S" \
            || { echo "::error::脚本里出现 base64 解码"; exit 1; }
          ! grep -nE '\b(curl|wget)\b[^\n|]*\|[[:space:]]*(sudo[[:space:]]+)?(ba)?sh' "$S" \
            || { echo "::error::脚本里出现管道执行"; exit 1; }
          echo "✅ 危险模式扫描通过（无 eval / base64 解码 / 管道执行）"
